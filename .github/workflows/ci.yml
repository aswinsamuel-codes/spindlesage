name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test with coverage (fails under 80%)
        run: uv run pytest --cov --cov-report=term-missing

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static analysis (bandit)
        run: uvx bandit -q -r apps core integrations intelligence experiments datasets/download_scripts
      - name: Python dependency audit (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --all-extras --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --progress-spinner off
      - name: Dashboard dependency audit (npm audit)
        working-directory: apps/dashboard
        run: npm audit --audit-level=moderate
