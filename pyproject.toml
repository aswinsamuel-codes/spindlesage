[project]
name = "spindlesage"
version = "0.0.1"
description = "An evidence-grounded AI operations agent for predictive maintenance in manufacturing."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "numpy>=2.1",
    "pandas>=2.2",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "uvicorn>=0.32",
    "xgboost>=2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# Not built as a distributable package yet; modules are imported from the repo root.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
